[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "optipool"
version = "0.2.0"
description = "Saved GKE node-pool observations and conservative capacity planning"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "google-auth[requests]>=2.38,<3", "requests>=2.32,<3", "PyYAML>=6.0,<7",
  "openpyxl>=3.1,<4", "cachecontrol>=0.14,<1", "PyJWT[crypto]>=2.10,<3",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# FastAPI intentionally declares dependency providers in parameter defaults.
ignore = ["B008"]
