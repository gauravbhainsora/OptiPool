name: Publish versioned image and Helm release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Validate release versions and packaged chart
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          test "$(helm show chart charts/optipool | awk '/^version:/ {print $2}')" = "$version"
          test "$(helm show chart charts/optipool | awk '/^appVersion:/ {gsub(/\"/, "", $2); print $2}')" = "$version"
          cd docs/helm
          sha256sum --check "optipool-$version.tgz.sha256"
          diff <(helm show chart "optipool-$version.tgz") <(helm show chart ../../charts/optipool)
          diff <(helm show values "optipool-$version.tgz") <(helm show values ../../charts/optipool)
          task_dir="$(mktemp -d)"
          tar -xzf "optipool-$version.tgz" -C "$task_dir"
          diff -r --exclude=Chart.yaml ../../charts/optipool "$task_dir/optipool"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish matching image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gauravbhainsora/optipool:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gauravbhainsora/OptiPool
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Publish GitHub release and immutable image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          printf 'ghcr.io/gauravbhainsora/optipool@%s\n' "$IMAGE_DIGEST" > image-digest.txt
          gh release create "$RELEASE_TAG" \
            "docs/helm/optipool-$version.tgz" \
            "docs/helm/optipool-$version.tgz.sha256" image-digest.txt \
            --verify-tag --title "OptiPool $version" --notes-file docs/release-notes.md
