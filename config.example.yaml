# Copy to config.local.yaml (ignored by Git). Demo requires no credentials.
mode: demo
auth_mode: local
database: data/optipool.db
# In live mode, empty discovers all ACTIVE projects accessible to the collector.
project_allowlist: []
# Explicit inheritance, pool override wins. Unclassified live pools default to production.
environment:
  example-dev-project: nonproduction
  example-prod-project/example-cluster/sandbox-pool: nonproduction
default_environment: production
live_validation_complete: false
min_metric_samples: 20
# GMP evaluation / native alignment. Supported: 60 or 300; GMP CPU still rate[5m].
metric_cadence_seconds: 300
min_reduction_observation_seconds: 86400
min_reduction_coverage: 0.9
# Query existing GMP risk counters only during explicit pool refresh. No scrape configuration changes.
collect_risk_metrics: false
# Optional existing cumulative OOM metric: uid/container labels, count across container restarts.
risk_oom_counter_metric: ""
require_cpu_risk_evidence: true
require_memory_risk_evidence: true
throttling_risk_threshold: 0.10
min_risk_observation_seconds: 86400
min_risk_coverage: 0.9
max_added_nodes: 100
max_replicas: 2000
pricing_mappings: {}
