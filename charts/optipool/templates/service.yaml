apiVersion: v1
kind: Service
metadata:
  name: {{ include "optipool.name" . }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: {{ printf "{\"default\":\"%s\"}" (include "optipool.name" .) | quote }}
  {{- end }}
  labels:
    {{- include "optipool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: optipool
    app.kubernetes.io/instance: {{ .Release.Name }}
