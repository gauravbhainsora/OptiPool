apiVersion: v1
kind: Pod
metadata:
  name: {{ include "optipool.name" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.37.0
      command: [sh, -ec]
      args:
        - >-
          wget -qO- http://{{ include "optipool.name" . }}:{{ .Values.service.port }}/healthz;
          wget -qO- http://{{ include "optipool.name" . }}:{{ .Values.service.port }}/readyz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
